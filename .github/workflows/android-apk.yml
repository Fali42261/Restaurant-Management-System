name: Android APK (DevUI)

on:
  push:
    branches:
      - DevUI
    paths:
      - 'RestaurantManagement.UI/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevUI
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore RestaurantManagement.UI/RestaurantManagement.UI.csproj -p:TargetFramework=net10.0-android

      - name: Build Android APK
        run: dotnet publish RestaurantManagement.UI/RestaurantManagement.UI.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwapDigit-Android-APK
          path: RestaurantManagement.UI/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 14
