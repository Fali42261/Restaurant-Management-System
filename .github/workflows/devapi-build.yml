name: DevApi Build and Authentication Tests
on:
  push:
    branches: [DevApi]
    paths:
      - 'RestaurantManagement.API/**'
      - 'RestaurantManagement.API.Tests/**'
      - 'database/**'
      - '.github/workflows/devapi-build.yml'
  pull_request:
    branches: [DevApi]
  workflow_dispatch:

jobs:
  authentication-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run API authentication unit tests
        run: dotnet test RestaurantManagement.API.Tests/RestaurantManagement.API.Tests.csproj --configuration Release

  build:
    runs-on: ubuntu-latest
    needs: authentication-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore API
        run: dotnet restore RestaurantManagement.API/RestaurantManagement.API.csproj
      - name: Build API
        run: dotnet build RestaurantManagement.API/RestaurantManagement.API.csproj --configuration Release --no-restore
