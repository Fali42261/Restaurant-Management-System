name: DevApi Build
on:
  push:
    branches: [ DevApi ]
    paths: [ 'RestaurantManagement.API/**', 'database/**', '.github/workflows/devapi-build.yml' ]
  pull_request:
    branches: [ DevApi ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RestaurantManagement.API/RestaurantManagement.API.csproj
      - run: dotnet build RestaurantManagement.API/RestaurantManagement.API.csproj --configuration Release --no-restore