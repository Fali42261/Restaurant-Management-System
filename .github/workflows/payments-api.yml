name: Payments API Build (DevUI)
on:
  push:
    branches: [DevUI]
    paths:
      - 'SwapDigit.Payments.Api/**'
      - '.github/workflows/payments-api.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SwapDigit.Payments.Api/SwapDigit.Payments.Api.csproj
      - name: Build
        run: dotnet build SwapDigit.Payments.Api/SwapDigit.Payments.Api.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish SwapDigit.Payments.Api/SwapDigit.Payments.Api.csproj --configuration Release --no-build --output ./publish/payments-api
      - uses: actions/upload-artifact@v4
        with:
          name: SwapDigit-Payments-API
          path: ./publish/payments-api/**
          if-no-files-found: error
          retention-days: 14
