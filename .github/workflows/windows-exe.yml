name: Windows EXE (DevUI)

on:
  push:
    branches:
      - DevUI
    paths:
      - 'RestaurantManagement.UI/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout DevUI
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore Windows target
        run: dotnet restore RestaurantManagement.UI/RestaurantManagement.UI.csproj -p:TargetFramework=net10.0-windows10.0.19041.0

      - name: Publish Windows x64 application
        run: dotnet publish RestaurantManagement.UI/RestaurantManagement.UI.csproj -f net10.0-windows10.0.19041.0 -c Release -p:SelfContained=false -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -r win-x64 -o ./publish/windows

      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: SwapDigit-Windows-EXE
          path: ./publish/windows/**
          if-no-files-found: error
          retention-days: 14
